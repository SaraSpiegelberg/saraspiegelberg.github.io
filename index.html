<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Spiegelberg | Em Breve</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        .container { padding: 20px; }
        .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; color: #38bdf8; }
        .status-badge { 
            display: inline-block; 
            background: rgba(56, 189, 248, 0.1); 
            color: #38bdf8; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 { font-size: 1.5rem; margin-bottom: 15px; font-weight: 400; opacity: 0.9; }
        p { font-size: 1rem; color: #94a3b8; max-width: 400px; margin: 0 auto 30px; line-height: 1.6; }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #38bdf8;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">Sistema em Atualização</div>
        <div class="logo">Sara Spiegelberg</div>
        <h1>Meu novo portfólio de TI está chegando.</h1>
        <p>Estou configurando os servidores e preparando o conteúdo. Em breve, meu currículo e projetos estarão disponíveis aqui.</p>
        <div class="loader"></div>
    </div>
</body>
</html>
